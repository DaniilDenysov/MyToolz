# The MyToolz pipeline. On every push to main, in this order:
#   1. Tests   → the EditMode and PlayMode suites (tests.yml); nothing below runs unless they pass
#   2. Version → the next version: the latest vMAJOR.MINOR.PATCH tag with its patch bumped, but never below
#                the Player Settings version (Project Settings > Player > Version)
#   3. Export  → one .unitypackage per Assets/Packages/<Tool>, kept as the MyToolz-<version>-unitypackages
#                artifact
#   4. Tag     → tags the commit v<version>
# To start a new major or minor line, raise the Player Settings version (for example to 2.1.0) and push to
# main: the next tag jumps to it, and every later push counts the patch up from there.
#
# Tag pushes no longer start this workflow: the tag job makes the tags, and tags pushed with the workflow's
# own token never start workflow runs anyway.
#
# Third-party actions that receive the Unity credentials are pinned to a commit, not a moving tag. Bump the
# SHA (and the "# vN" comment) deliberately.
#
# ── One-time setup (Settings → Secrets and variables → Actions) ───────────────
#   UNITY_LICENSE   – contents of your .ulf activation file (Personal), or UNITY_SERIAL for Plus/Pro
#   UNITY_EMAIL     – your Unity account email
#   UNITY_PASSWORD  – your Unity account password
# Without them the Unity jobs are skipped with a notice, and nothing is exported or tagged.

name: Export MyToolz UnityPackages (multi)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancelled and never run side by side, so two pushes to main can't claim the same version.
  group: mytoolz-export-${{ github.ref }}
  cancel-in-progress: false

env:
  UNITY_VERSION: 6000.3.16f1
  OUT_DIR: build_output

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml
    # A called workflow can never hold more than its caller, and the top-level permissions block above
    # makes every scope it does not list "none". Without this, tests.yml asking for checks: write is a
    # hard workflow-validation error, not a runtime failure. Kept on the job so the export stays read-only.
    permissions:
      contents: read
      checks: write
    secrets: inherit

  version:
    name: Next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ProjectSettings

      - name: Bump the patch of the latest version tag
        id: next
        run: |
          set -euo pipefail
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'

          base="$(sed -n 's/^  bundleVersion: *//p' ProjectSettings/ProjectSettings.asset | tr -d '\r')"
          if ! printf '%s' "$base" | grep -Eq "$semver"; then
            echo "::error::Player Settings version '$base' is not MAJOR.MINOR.PATCH."
            exit 1
          fi

          latest="$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##' | grep -E "$semver" | sort -V | tail -n1 || true)"

          if [ -z "$latest" ]; then
            next="$base"
          else
            IFS=. read -r major minor patch <<< "$latest"
            next="$(printf '%s\n%s\n' "$major.$minor.$((patch + 1))" "$base" | sort -V | tail -n1)"
          fi

          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Latest tag: ${latest:-none}, Player Settings: $base -> exporting v$next"

  export:
    name: Export unitypackages
    needs: [tests, version]
    # The tests workflow reports whether the Unity license secrets are set (see its license job).
    if: needs.tests.outputs.unity_ready == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace as safe (git)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Prepare output dir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OUT_DIR}"

      - name: Export all packages under Assets/Packages
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: .
          targetPlatform: StandaloneLinux64
          allowDirtyBuild: true
          # The version comes from the version job, the same one the tag job uses.
          versioning: Custom
          version: ${{ needs.version.outputs.version }}
          buildMethod: MyToolz.CI.CIEntryPoint.ExportAllToolsUnderAssetsPackages
          customParameters: >-
            -batchmode
            -nographics
            -quit
            -logFile ${{ github.workspace }}/UnityEditor-ci.log
            -stackTraceLogType Full
            -logTimestamp
            -mytoolzOutDir ${{ github.workspace }}/${{ env.OUT_DIR }}
            -mytoolzMergeDeps true
            -mytoolzIncludeProjectDeps true

      - name: Dump logs to console (on failure)
        if: failure()
        shell: bash
        run: |
          echo "===== Tail: UnityEditor-ci.log ====="
          if [ -f "UnityEditor-ci.log" ]; then tail -n 250 "UnityEditor-ci.log"; else echo "UnityEditor-ci.log missing"; fi
          echo "===== Tail: Exporter-ci.log ====="
          if [ -f "${OUT_DIR}/Exporter-ci.log" ]; then tail -n 250 "${OUT_DIR}/Exporter-ci.log"; else echo "Exporter-ci.log missing"; fi
          echo "===== OUT_DIR content ====="
          ls -la "${OUT_DIR}" || true
          find "${OUT_DIR}" -maxdepth 2 -type f -print || true

      - name: List the packages in the run summary
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "### MyToolz v$VERSION"
            echo ""
            echo "Download the MyToolz-$VERSION-unitypackages artifact for these packages:"
            echo ""
            find "${OUT_DIR}" -maxdepth 1 -name '*.unitypackage' -printf '%f\n' | sort | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unitypackage artifacts
        uses: actions/upload-artifact@v4
        with:
          # Named after the version, so every v<version> tag has its packages.
          name: MyToolz-${{ needs.version.outputs.version }}-unitypackages
          path: ${{ env.OUT_DIR }}/*.unitypackage
          if-no-files-found: error
          retention-days: 90

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs
          path: |
            UnityEditor-ci.log
            ${{ env.OUT_DIR }}/Exporter-ci.log
            /home/runner/.config/unity3d/Editor.log
            /home/runner/.config/unity3d/Logs/**/*
            /github/home/.config/unity3d/Editor.log
            /github/home/.config/unity3d/Logs/**/*
          if-no-files-found: warn
          retention-days: 14

  tag:
    name: Tag the version
    # Waits for the export too, so every version tag has its packages.
    needs: [version, export]
    # Only main is versioned: a manual run on another branch exports but never tags.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA"
          echo "Tagged $GITHUB_SHA as v$VERSION" >> "$GITHUB_STEP_SUMMARY"
